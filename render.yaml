services:
  - type: web
    name: oddnext-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: MOOLRE_USERNAME
        sync: false
      - key: MOOLRE_API_USER
        sync: false
      - key: MOOLRE_PUBLIC_KEY
        sync: false
      - key: MOOLRE_ACCOUNT_NUMBER
        sync: false
      - key: MOOLRE_API_KEY
        sync: false
      - key: MOOLRE_WEBHOOK_SECRET
        sync: false
      - key: MOOLRE_SENDER_ID
        value: Oddnext
      - key: MOOLRE_BASE_URL
        value: https://api.moolre.com
      - key: ADMIN_EMAIL
        value: admin@system.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_BACKEND_URL
        value: https://oddnext.onrender.com
      - key: CALLBACK_URL
        value: https://oddnext.onrender.com/api/payments/webhook
